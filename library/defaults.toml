# Defaults every company inherits. Override in company.toml:
#   [policy] autonomy/rules = [...] replaces;  extra_autonomy/extra_rules/extra_gates = [...] extends
#   [[gates]] in company.toml replaces the gate list below.

lanes = ["backlog", "todo", "in_progress", "review", "needs_founder", "done"]
workflows = ["standup", "kickoff", "approvals", "weekly-review", "setup-board", "hire"]

autonomy = [
  "Research: web search, reading docs and public sources.",
  "Drafting: specs, posts, emails, reports (saved as files, never sent).",
  "Code: writing and running code and tests locally; commits on a local feature branch.",
  "Analysis of data already in the workspace.",
]

rules = [
  "Stay inside your ticket and your owned paths. If the work grows past about 2x the ticket, stop and propose a split.",
  "Mark unverified facts `(unverified)` and give a source URL for every external claim.",
  "Never invent customers, quotes, metrics, interview results or test outcomes. Report failures plainly.",
  "Record any choice a future agent must know (architecture, positioning, pricing, a dropped option) in `company/decisions.md`: date, decision, why, decided by.",
  "Read before you overwrite or delete anything. Prefer small, reversible changes.",
  "Never put secrets, credentials or personal data in files, commits or prompts.",
]

[[gates]]
name = "External communication"
examples = "Sending email, DMs, forum/social posts, replying to customers, opening issues or PRs on others' repos"

[[gates]]
name = "Publishing"
examples = "`git push` to a shared remote, releases, package publishing, making a repo public, website changes"

[[gates]]
name = "Money"
examples = "Purchases, subscriptions, paid APIs beyond `ops/budget.md`, invoices, pricing changes"

[[gates]]
name = "Legal and identity"
examples = "Contracts, NDAs, terms, licenses, registrations, anything signed or sent in the founder's name"

[[gates]]
name = "Irreversible"
examples = "Deleting data or history, force-push, dropping databases, removing customer records"

[[gates]]
name = "Direction"
examples = "Changing the charter, customer, goals or roles; starting or killing a product line"
