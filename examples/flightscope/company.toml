# Flightscope: open-source observability for onboard AI on drones.
# Rebuild after edits:  python3 ~/dev/company-factory/factory.py build .

[company]
name = "Flightscope"
mission = "Help teams that run AI on physical machines know whether their AI works in the field, and what to retrain on."
founder_title = "Founder"
bet = """
"Flight Review for onboard AI": an open-source CLI that takes a flight log (PX4/ArduPilot), camera video and model detections,
and produces one synced timeline, flagged weak moments, model-version comparisons and a retraining dataset.
Path: drones -> edge AI devices -> robotics.
"""
icp = """
Commercial drone companies with 1-200 aircraft running their own onboard AI (inspection, agriculture, forestry, mapping)
in ANZ, USA, Europe and India. Not now: defense, large drone makers that build in-house.
"""
principles = [
  "Talk to customers before building more.",
  "Open source first; earn the right to charge.",
  "Thin over complete: ship the smallest thing that proves a point.",
  "Build on standards (PX4/ArduPilot logs, MCAP, Rerun), not against them.",
  "Cheap failure is fine; hidden failure is not.",
]

[orchestrator]
title = "Chief of Staff"

[taskboard]
enabled = true
project = "Flightscope HQ"
prefix = "FSC"

[defaults]
model = "sonnet"

[policy]
extra_rules = [
  "Product code is Apache-2.0 open source; never copy code with an incompatible license.",
]

[[goals]]
objective = "Prove drone teams want this (by 2027-01-31)"
key_results = [
  "10 customer conversations across ANZ/USA/Europe/India",
  "5 design partners agree to run flightscope on a real flight",
  "2 agree to a paid pilot",
]

[[goals]]
objective = "Ship flightscope v0.1 (by 2027-01-15)"
key_results = [
  "view, report, compare and export work on a PX4 SITL flight and one real dataset",
  "Launch posts drafted for PX4 Discuss, ArduPilot Discourse, r/drones and Show HN",
]

[[roles]]
use = "product-manager"

[[roles]]
use = "tech-lead"
skills_add = ["flight-log-analysis"]

[[roles]]
use = "engineer"
owns = ["product/flightscope/", "product/examples/", "product/README.md", "product/pyproject.toml"]
skills_add = ["flight-log-analysis"]

[[roles]]
use = "qa-engineer"
skills_add = ["flight-log-analysis"]

[[roles]]
use = "market-researcher"

[[roles]]
use = "customer-researcher"

[[roles]]
use = "sales-dev"
responsibilities_add = [
  "Keep the target list in research/targets.md; work the best-fit targets first, region by region.",
]

[[roles]]
use = "growth-marketer"

[[roles]]
use = "finance-ops"

# The live office: python3 ~/dev/company-factory/factory.py office .
[office]
theme = "auto"                 # auto | day | night
founder_look = { shirt = "#2b2f3a", hair_style = "short", accessory = "glasses" }

[[office.rooms]]
id = "flight-lab"
title = "Flight Lab"
roles = ["tech-lead", "engineer", "qa-engineer"]
floor = "#b9cbd9"

[[office.rooms]]
id = "field"
title = "Field Research"
roles = ["product-manager", "market-researcher", "customer-researcher"]

[[office.rooms]]
id = "go-to-market"
title = "Go-to-market"
roles = ["sales-dev", "growth-marketer", "finance-ops"]
