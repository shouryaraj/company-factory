# open-source: maintainers of an open-source CLI, with custom roles, skills and a /triage workflow
#   Edit, then rebuild:  company-factory build .
# Orbit is fictional. Shows every plug-in point: inline roles, custom skills, a custom workflow.

[company]
name = "Orbit"
mission = "Keep a popular open-source CLI healthy: fast issue response, steady releases, docs people can follow."
founder_title = "Lead Maintainer"
bet = """
Most open-source projects die from maintainer burnout, not missing features. Orbit runs triage, release prep and
docs with agents so the humans only review, decide and merge.
"""
principles = [
  "Every new issue gets a human-quality first response within a day.",
  "Never merge, release or close issues without the Lead Maintainer.",
  "Docs are part of the change, not a follow-up.",
]

[orchestrator]
title = "Maintainer on Duty"

[taskboard]
prefix = "ORB"

[defaults]
model = "sonnet"

[workflows]
use = ["standup", "kickoff", "approvals", "weekly-review", "hire", "triage"]

[[gates]]
name = "Public action"
examples = "Commenting on issues or PRs, closing or labelling on GitHub, merging, tagging a release, publishing a package"

[[gates]]
name = "Irreversible"
examples = "Deleting branches, rewriting history, yanking a release"

[[goals]]
objective = "Healthy project (this month)"
key_results = ["Median first response under 24h", "Open bug count under 30", "Release v2.4 with migration notes"]

[[roles]]
use = "tech-lead"
id = "core-maintainer"
title = "Core Maintainer"
owns = ["src/", "docs/adr/"]
look = { shirt = "#5a3825", hair_style = "bald", accessory = "glasses" }

[[roles]]
use = "engineer"
owns = ["src/", "tests/"]

[[roles]]
id = "triager"
department = "community"
title = "Issue Triager"
description = "Reads new issues and PRs, reproduces bugs, labels and drafts first responses. Use for any incoming issue or PR."
mission = "No issue waits more than a day for a useful, kind first response."
tools = ["Read", "Grep", "Glob", "Bash", "Write"]
skills = ["issue-triage"]
owns = ["triage/"]
responsibilities = ["Reproduce bugs locally with the smallest possible example.", "Draft a reply and labels per issue in `triage/<number>.md`."]
never = ["Comment, label or close anything on GitHub."]
done = ["Each issue has a draft reply, labels, and a repro result or a clear question for the reporter."]
look = { shirt = "#00a6a6", accessory = "headset" }

[[roles]]
id = "docs-writer"
department = "community"
title = "Docs Writer"
description = "Writes and fixes docs, guides and examples. Use whenever behaviour changes or users get confused."
mission = "Anyone can go from install to first success in five minutes using only the docs."
skills = ["content-writing"]
owns = ["docs/"]
responsibilities = ["Turn confused issues into docs fixes.", "Run every command in a guide before saving it."]
done = ["Every command in the change was run and its output checked."]

[[roles]]
id = "release-manager"
department = "release"
title = "Release Manager"
description = "Prepares releases: changelog, migration notes, version bumps on a branch. Use when a release is planned."
mission = "Releases are boring: predictable, documented, reversible."
tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
skills = ["release-notes"]
owns = ["CHANGELOG.md", "release/"]
never = ["Tag, push or publish."]
done = ["Changelog and migration notes drafted; release checklist in `release/<version>.md` with every box checked or explained."]
look = { shirt = "#9b5de5", hair_style = "long" }

[[roles]]
use = "growth-marketer"
id = "community-manager"
title = "Community Manager"
owns = ["community/"]

[office]
title = "Orbit Maintainers"

[[office.rooms]]
id = "core"
title = "Core"
roles = ["core-maintainer", "engineer"]

[[office.rooms]]
id = "community"
title = "Community"
roles = ["triager", "docs-writer", "community-manager"]
floor = "#d4c8e2"

[[office.rooms]]
id = "release"
title = "Release Desk"
roles = ["release-manager"]
floor = "#e0c3c3"
