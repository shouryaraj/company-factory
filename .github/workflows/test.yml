name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ["20", "22", "24"]
        include:
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: build every example with the packed CLI
        shell: bash
        run: |
          npm pack --silent
          npm install -g ./company-factory-*.tgz
          company-factory --version
          for ex in $(company-factory list examples | cut -d' ' -f1); do
            company-factory init "$RUNNER_TEMP/$ex" --example "$ex"
            company-factory build "$RUNNER_TEMP/$ex"
            company-factory validate "$RUNNER_TEMP/$ex"
          done
